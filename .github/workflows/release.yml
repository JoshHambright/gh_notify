name: Release
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: write
env:
  VELOPACK_VERSION: "1.2.161"
defaults:
  run:
    shell: pwsh
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
    secrets: inherit
  release:
    needs: gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install vpk
        run: dotnet tool install -g vpk --version $env:VELOPACK_VERSION
      - name: Version from tag
        id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host "::error::tag '$env:TAG' is not vMAJOR.MINOR.PATCH (prereleases are not supported)"
            exit 1
          }
          "version=$($env:TAG.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - name: Previous release (for deltas and the upgrade test)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # The current release already exists (release-please made it) but has no assets yet, so pick the newest
          # other release that has a Setup.exe. The first release has no predecessor: every step tolerates that.
          New-Item -ItemType Directory -Force artifacts/releases | Out-Null
          $prevTag = $null
          $tags = @(gh release list --repo "$env:GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName --jq '.[].tagName')
          foreach ($t in $tags) {
            if (-not $t -or $t -eq $env:TAG) { continue }
            $names = @(gh release view $t --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if ($names | Where-Object { $_ -like '*Setup.exe' }) { $prevTag = $t; break }
          }
          if ($prevTag) {
            gh release download $prevTag --repo "$env:GITHUB_REPOSITORY" --dir artifacts/releases --clobber
            if ($LASTEXITCODE) { Write-Host "::error::could not download $prevTag"; exit 1 }
          } else {
            Write-Host "::notice::no previous release to download"
          }
          $files = @(Get-ChildItem artifacts/releases -File -ErrorAction SilentlyContinue)
          $old = $files | Where-Object Name -like '*Setup.exe' | Select-Object -First 1
          "setup=$(if ($old) { $old.FullName })" >> $env:GITHUB_OUTPUT
          "has_releases=$($files.Count -gt 0)" >> $env:GITHUB_OUTPUT
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $tag = $env:TAG
          # Prefer the body release-please wrote on the GitHub release.
          $notes = (gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json body --jq .body 2>$null | Out-String).Trim()
          if ($LASTEXITCODE) { $notes = ''; $global:LASTEXITCODE = 0 }
          if (-not $notes) {
            # Manual dispatch without a release: annotated tag message, else the commit subjects since the previous tag.
            if ((git cat-file -t "refs/tags/$tag") -eq 'tag') {
              $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
            }
            if (-not $notes) {
              $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
              $global:LASTEXITCODE = 0
              $lines = if ($prev) { git log --format='- %s' "$prev..$tag" } else { git log --format='- %s' -20 $tag }
              if ($LASTEXITCODE) { Write-Host "::error::git log failed"; exit 1 }
              $notes = ($lines -join "`n")
            }
          }
          $notes = (($notes -split "`r?`n") | Where-Object { $_ -notmatch '^\s*Co-Authored-By:' }) -join "`n"
          Set-Content artifacts/changelog.md $notes.Trim()
          # Hand-written docs/releases/<tag>.md on top, the changelog under "All changes" (see build/release-notes.ps1).
          # No notes, no publish. Notes merged to main after the tag still count: add them, then re-run this workflow.
          $file = "docs/releases/$tag.md"
          if (-not (Test-Path $file)) {
            git fetch -q origin main
            git show "origin/main:$file" > $file 2>$null
            if ($LASTEXITCODE -or -not (Get-Item $file -ErrorAction SilentlyContinue).Length) {
              Remove-Item $file -ErrorAction SilentlyContinue
              Write-Host "::error::$file is missing. Copy docs/releases/TEMPLATE.md to $file, merge it to main, then re-run Actions -> Release with tag $tag."
              exit 1
            }
            $global:LASTEXITCODE = 0
          }
          ./build/release-notes.ps1 -Tag $tag -Changelog artifacts/changelog.md -Out artifacts/notes.md
      - name: Pack
        run: |
          $p = @{ Version = '${{ steps.v.outputs.version }}'; OutDir = 'artifacts/new'; ReleaseNotes = 'artifacts/notes.md' }
          if ('${{ steps.prev.outputs.has_releases }}' -eq 'True') { $p.PrevReleases = 'artifacts/releases' }
          ./build/pack.ps1 @p
      - name: Upgrade test from the previous release
        if: steps.prev.outputs.setup != ''
        run: ./build/test-install.ps1 -OldSetup "${{ steps.prev.outputs.setup }}" -NewFeed artifacts/new
      # SIGNING: sign artifacts/new/* here once a certificate or Trusted Signing account exists.
      - name: Keep the Windows packages and notes for publishing
        uses: actions/upload-artifact@v7
        with:
          name: release-win
          path: |
            artifacts/new/
            artifacts/notes.md
          if-no-files-found: error
          retention-days: 7
  # macOS: both channels, packed with the same notes, and upgrade-tested from the previous macOS release when there is one. Nothing
  # is published until this and the Windows job have both succeeded (publish, below).
  release-mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install vpk
        run: dotnet tool install -g vpk --version $env:VELOPACK_VERSION
      - uses: actions/download-artifact@v4
        with:
          name: release-win
          path: artifacts/win
      - name: Previous macOS packages
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force artifacts/mac-prev | Out-Null
          $found = $false
          $tags = @(gh release list --repo "$env:GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName --jq '.[].tagName')
          foreach ($t in $tags) {
            if (-not $t -or $t -eq $env:TAG) { continue }
            $names = @(gh release view $t --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if ($names | Where-Object { $_ -like 'releases.osx-*.json' }) {
              gh release download $t --repo "$env:GITHUB_REPOSITORY" --dir artifacts/mac-prev --pattern '*osx-*' --clobber
              if ($LASTEXITCODE) { Write-Host "::error::could not download $t"; exit 1 }
              Write-Host "previous macOS release: $t"
              $found = $true
              break
            }
          }
          if (-not $found) { Write-Host "::notice::no previous macOS release (the first one ships full packages only)" }
          "found=$found" >> $env:GITHUB_OUTPUT
      - name: Pack (osx-arm64, osx-x64)
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: ./build/pack-mac.sh "${TAG#v}" artifacts/mac --prev artifacts/mac-prev --notes artifacts/win/notes.md osx-arm64 osx-x64
      - name: Upgrade test from the previous macOS release (arm64)
        if: steps.prev.outputs.found == 'True'
        shell: bash
        run: ./build/test-install-mac.sh artifacts/mac-prev artifacts/mac osx-arm64
      - name: Each feed lists only its own channel
        run: |
          foreach ($rid in 'osx-arm64', 'osx-x64') {
            $feed = "artifacts/mac/releases.$rid.json"
            if (-not (Test-Path $feed)) { Write-Host "::error::$feed is missing"; exit 1 }
            $other = if ($rid -eq 'osx-arm64') { 'osx-x64' } else { 'osx-arm64' }
            $text = Get-Content $feed -Raw
            if ($text -match [regex]::Escape($other) -or $text -match '-win-') { Write-Host "::error::$feed mentions another channel"; exit 1 }
          }
      # SIGNING: Developer ID signing and notarization go into build/pack-mac.sh (vpk --signAppIdentity / --notaryProfile).
      - name: Keep the macOS packages for publishing
        uses: actions/upload-artifact@v7
        with:
          name: release-mac
          path: artifacts/mac/
          if-no-files-found: error
          retention-days: 7
  # Publishes Windows and both macOS channels into the release-please release, then writes the full notes once. --merge adds the
  # assets without replacing the body; a re-run with the same tag replaces assets of the same name.
  publish:
    needs: [release, release-mac]
    runs-on: windows-latest
    steps:
      - name: Install vpk
        run: dotnet tool install -g vpk --version $env:VELOPACK_VERSION
      - uses: actions/download-artifact@v4
        with:
          name: release-win
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: artifacts/mac
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          vpk upload github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token "$env:GH_TOKEN" `
            --outputDir artifacts/new --merge --publish --tag "$env:TAG"
          if ($LASTEXITCODE) { Write-Host "::error::Windows upload failed"; exit 1 }
          foreach ($rid in 'osx-arm64', 'osx-x64') {
            vpk upload github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token "$env:GH_TOKEN" `
              --outputDir artifacts/mac --channel $rid --merge --tag "$env:TAG"
            if ($LASTEXITCODE) { Write-Host "::error::upload of $rid failed"; exit 1 }
          }
      - name: Release page notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit $env:TAG --repo "$env:GITHUB_REPOSITORY" --notes-file artifacts/notes.md
          if ($LASTEXITCODE) { Write-Host "::error::could not set the release notes on $env:TAG"; exit 1 }
