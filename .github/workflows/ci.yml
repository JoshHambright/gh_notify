name: CI
on:
  push:
    branches: [main]
  pull_request:
    # The release PR only touches these. It is pushed with GITHUB_TOKEN, and GitHub holds such runs for manual approval;
    # the code was already tested on main, and the release workflow runs CI again on the tagged commit.
    paths-ignore: [CHANGELOG.md, .release-please-manifest.json, version.txt]
  workflow_call:
    inputs:
      ref:
        description: Ref to test (default is the triggering commit)
        required: false
        type: string
        default: ""
    secrets:
      LEAK_TERMS:
        required: false
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  VELOPACK_VERSION: "1.2.161"
defaults:
  run:
    shell: pwsh
jobs:
  # GhNotify.UI must never touch Windows APIs: build it (and the Core projects it uses) and run its headless tests on Linux.
  ui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/GhNotify.UI.Tests/GhNotify.UI.Tests.csproj
      - name: Build UI and Core (warnings are errors)
        run: dotnet build tests/GhNotify.UI.Tests/GhNotify.UI.Tests.csproj -c Release --no-restore -warnaserror
      - name: UI tests (headless)
        run: dotnet test tests/GhNotify.UI.Tests/GhNotify.UI.Tests.csproj -c Release --no-build
  # macOS: the Swift shim, the Mac projects and every platform-neutral test, then pack, install, update and uninstall. The packed
  # .pkg is kept as an artifact for the Mac tester (build/mac-test.sh --round 2, docs/macos-testing.md).
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Swift shim (universal)
        run: ./native/mac/build.sh
        shell: bash
      - name: Build (warnings are errors)
        run: |
          foreach ($p in 'tests/GhNotify.Tests', 'tests/GhNotify.UI.Tests', 'tests/GhNotify.Platform.Mac.Tests') {
            dotnet build $p -c Release -warnaserror
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Tests
        run: |
          $failed = 0
          foreach ($p in 'tests/GhNotify.Tests', 'tests/GhNotify.UI.Tests', 'tests/GhNotify.Platform.Mac.Tests') {
            dotnet test $p -c Release --no-build
            if ($LASTEXITCODE) { $failed = 1 }
          }
          exit $failed
      - name: Install vpk
        run: dotnet tool install -g vpk --version $env:VELOPACK_VERSION
      - name: Pack Apple Silicon (osx-arm64, two versions)
        shell: bash
        run: |
          ./build/pack-mac.sh 0.0.1-ci artifacts/mac-old osx-arm64
          ./build/pack-mac.sh 0.0.2-ci artifacts/mac-new osx-arm64
      - name: Pack Intel (osx-x64; built here, not run)
        shell: bash
        run: ./build/pack-mac.sh 0.0.2-ci artifacts/mac-x64 osx-x64
      - name: Install / update / uninstall test
        shell: bash
        run: ./build/test-install-mac.sh artifacts/mac-old artifacts/mac-new osx-arm64
      - name: Keep the package for the Mac tester
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gh_notify-macos-arm64
          path: artifacts/mac-new/*.pkg
          if-no-files-found: warn
          retention-days: 14
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore GhNotify.slnx
      - name: Build (warnings are errors)
        run: dotnet build GhNotify.slnx -c Release --no-restore -warnaserror
      - name: Format
        run: dotnet format GhNotify.slnx --verify-no-changes --no-restore
      - name: Test with coverage
        run: dotnet test GhNotify.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage
      - name: Coverage floor
        run: ./build/check-coverage.ps1 -Results artifacts/coverage
      - name: Leak scan
        env:
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
        run: ./build/leak-scan.ps1
      - name: Velopack package and vpk versions match
        run: |
          $m = Select-String -Path src/GhNotify.App/GhNotify.App.csproj -Pattern '<PackageReference Include="Velopack" Version="([^"]+)"'
          if (-not $m) { Write-Host "::error::Velopack PackageReference not found in GhNotify.App.csproj"; exit 1 }
          $pkg = $m.Matches[0].Groups[1].Value
          if ($pkg -ne $env:VELOPACK_VERSION) {
            Write-Host "::error::Velopack package $pkg != VELOPACK_VERSION $env:VELOPACK_VERSION (ci.yml, release.yml): bump them together"
            exit 1
          }
      - name: Install vpk
        run: dotnet tool install -g vpk --version $env:VELOPACK_VERSION
      - name: Install / upgrade / uninstall test (includes published release -> new upgrade)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build/pack.ps1 -Version 0.0.1-ci -OutDir artifacts/old
          ./build/pack.ps1 -Version 0.0.2-ci -OutDir artifacts/new
          # Must sort above the latest published release so the release -> new step is an upgrade.
          ./build/pack.ps1 -Version 99.0.0-ci -OutDir artifacts/release-upgrade
          ./build/test-install.ps1 -OldSetup artifacts/old/GhNotify-win-Setup.exe -NewFeed artifacts/new -ReleaseUpgradeFeed artifacts/release-upgrade
