name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/**"
      - "*.slnx"
      - "Directory.*.props"
      - "Directory.*.targets"
      - "global.json"
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build GhNotify.slnx -c Release
      - uses: github/codeql-action/analyze@v4
