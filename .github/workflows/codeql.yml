name: CodeQL
# The main ruleset requires a CodeQL result on every PR, so pull_request has no path filter (a skipped run blocks the merge).
# The release PR is pushed with GITHUB_TOKEN, which starts no workflows; release-please.yml calls this one for it instead.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_call:
    inputs:
      branch:
        description: Branch to analyze (the release PR's head branch)
        required: true
        type: string
      pr:
        description: Pull request number the results are uploaded for
        required: true
        type: number
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.sha }}
      - id: head
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build GhNotify.slnx -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          # Called for the release PR: upload against the PR's head so the ruleset sees it. Empty means the triggering ref.
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || '' }}
          sha: ${{ inputs.pr && steps.head.outputs.sha || '' }}
